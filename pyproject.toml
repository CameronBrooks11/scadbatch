[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scadbatch"
version = "2.0.0rc1"
description = "Batch export models from parametric OpenSCAD designs using CSV or Customizer JSON parameter sets."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Cameron K. Brooks", email = "cambrooks3393@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/CameronBrooks11/scadbatch"
Issues = "https://github.com/CameronBrooks11/scadbatch/issues"

[project.scripts]
scadbatch = "scadbatch.cli:main"
# Deprecated alias for the command this tool used to install; removed after v2.0.
openscad-export = "scadbatch.cli:main"

[project.gui-scripts]
scadbatch-gui = "scadbatch.gui:main"
openscad-export-gui = "scadbatch.gui:main"

[tool.setuptools.packages.find]
include = ["scadbatch*"]

[dependency-groups]
dev = ["pre-commit>=4.0", "pytest>=8.0", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
