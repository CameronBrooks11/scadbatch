# Builds docs/ into a book with mdbook and publishes it to GitHub Pages.
#
# Pages is configured with build_type "workflow", so this file is what publishes the
# site; there is no branch to push rendered HTML to. The `github-pages` environment
# carries a branch policy and no required reviewers, so a merge to main deploys
# without waiting for anyone.
#
# A pull request builds but does not deploy, which is what catches a broken
# SUMMARY.md before it reaches the site. `create-missing = false` in book.toml is
# what makes that catch work: without it a dangling entry renders an empty page and
# the build passes.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time. Queue rather than cancel, so a merge that
# lands while an earlier one is publishing still reaches the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version apps/mdbook installs on the workstation, so the book
      # built locally before a change is the book that deploys. The digest is
      # recorded here rather than read from the release: a checksums file sitting in
      # the same mutable release only proves the download was not corrupted.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: 0.5.4
          MDBOOK_SHA256: 5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89
        run: |
          set -euo pipefail
          asset="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$asset" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${asset}"
          echo "${MDBOOK_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" mdbook
          ./mdbook --version

      - run: ./mdbook build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: book

  deploy:
    name: Publish to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
