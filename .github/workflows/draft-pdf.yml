# Builds the JOSS draft PDF on demand and publishes it as a run artifact.
# It deliberately does not commit paper.pdf: the committed copy is regenerated
# by hand when the paper is submitted, so main stays human-authored.

name: Draft PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload draft PDF
        uses: actions/upload-artifact@v7
        with:
          name: paper-draft
          path: paper/paper.pdf
