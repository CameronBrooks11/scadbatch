blank_issues_enabled: true
contact_links:
  - name: Question about using scadbatch
    url: https://github.com/CameronBrooks11/scadbatch/issues/new
    about: >
      Ask as an ordinary issue. There is no separate discussions board, and a question asked
      in the open is findable by whoever asks it next.
  - name: How support works
    url: https://github.com/CameronBrooks11/scadbatch/blob/main/SUPPORT.md
    about: What to include, and what response to expect.
  - name: OpenSCAD itself
    url: https://github.com/openscad/openscad/issues
    about: >
      For how OpenSCAD renders, what it accepts in a parameter set, or a message it printed
      that this tool only passed along.
