name: Bug report
description: Something behaves differently from what you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A reproduction is worth more than a description. If you can trim the model and the
        parameter file down to something small enough to paste, that is the most useful thing
        you can send.

        Note that several refusals are deliberate — a ragged CSV row, a repeated name, a
        non-finite number — and the message names the file, and the line or the path within
        it. The README's CSV and JSON sections list them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it did, including any message in full.
      placeholder: |
        $ scadbatch export part.scad params.csv out
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: The .scad file
      description: The smallest model that still shows it. Paste it rather than attaching.
      render: openscad
    validations:
      required: false
  - type: textarea
    id: parameters
    attributes:
      label: The parameter file
      description: The CSV or JSON, or the few rows that matter.
    validations:
      required: false
  - type: input
    id: openscad
    attributes:
      label: OpenSCAD version
      description: "`openscad --version`. Behaviour differs between releases, so this decides a lot."
      placeholder: OpenSCAD version 2026.08.01
    validations:
      required: true
  - type: input
    id: scadbatch
    attributes:
      label: scadbatch version
      description: >
        `pip show scadbatch` or `uv pip show scadbatch`, or the commit if you are running from
        a checkout. There is no `--version` flag yet. A `--summary` file records it too, in its
        `tool` block.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: Debian 13, Python 3.13
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: The run summary, if you have one
      description: >
        `--summary run.json` records the engine, the inputs and every case. `counts.errors`
        is the number of cases OpenSCAD printed an error for, including cases it exited 0 on —
        often the whole story when a run looks successful but the geometry is wrong.
      render: json
    validations:
      required: false
